<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Copilote de réunion : écoute, suit les questions en direct, produit le bilan.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copilot">
<title>Meeting Copilot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<style>
  :root {
    --bg:          #0d1117;
    --surface:     #161b22;
    --surface-2:   #1c2129;
    --border:      #262c36;
    --border-soft: #21262d;
    --text:        #e6edf3;
    --dim:         #9198a1;
    --faint:       #6e7681;
    --accent:      #58a6ff;
    --accent-dim:  #1f6feb;
    --danger:      #f85149;
    --ok:          #3fb950;
    --warn:        #d29922;
    --anim:        300ms;
    --ease:        cubic-bezier(.4, 0, .2, 1);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --bar-h: 72px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
    padding: calc(var(--safe-t) + 10px) 14px calc(var(--bar-h) + var(--safe-b) + 20px);
    max-width: 720px; margin: 0 auto;
  }

  /* ---------------- Sujet ---------------- */
  .topic-wrap { margin-bottom: 18px; }
  #topic {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-family: inherit; font-size: 16px;
    padding: 13px 14px; appearance: none; -webkit-appearance: none;
  }
  #topic::placeholder { color: var(--faint); }
  #topic:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(88,166,255,.14); }
  #topic:disabled { opacity: .55; }

  /* ---------------- Bouton d'écoute ---------------- */
  .listen-row { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  #listenBtn {
    width: 96px; height: 96px; flex: none; border-radius: 50%; border: none;
    background: var(--accent-dim); color: #fff; font-family: inherit;
    font-size: 15px; font-weight: 700; line-height: 1.25; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 6px 20px rgba(31,111,235,.35);
    transition: transform .1s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  #listenBtn .ico { font-size: 26px; line-height: 1; }
  #listenBtn:active { transform: scale(.95); }
  #listenBtn.on { background: var(--surface-2); color: var(--text); box-shadow: 0 0 0 3px rgba(248,81,73,.3); }
  #listenBtn:disabled { opacity: .4; box-shadow: none; cursor: default; }

  .meta { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .live { display: flex; align-items: center; gap: 9px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.rec { background: var(--danger); animation: blink 1.15s ease-in-out infinite; }
  .dot.paused { background: var(--warn); }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .15 } }
  #chrono { font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; }
  #liveLabel { font-size: 13px; color: var(--dim); }

  /* ---------------- En-tête de section ---------------- */
  .sec-head {
    display: flex; align-items: center; gap: 10px; margin: 0 0 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .09em;
    color: var(--dim); text-transform: uppercase;
  }
  .sec-head .ttl { flex: none; }
  .sec-head .spacer { flex: 1; }
  #analyzing {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: none;
    color: var(--accent); opacity: 0; transition: opacity var(--anim) var(--ease);
    white-space: nowrap;
  }
  #analyzing.on { opacity: .85; }
  #analyzing .pulse { animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--dim);
    border-radius: 9px; width: 38px; height: 38px; flex: none; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn:disabled { opacity: .4; cursor: default; }

  /* ---------------- Questions actives ---------------- */
  ul.qlist { list-style: none; margin: 0; padding: 0; }
  ul.qlist li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 15px 16px;
    margin-bottom: 9px;
    overflow: hidden;
    position: relative;
    transition:
      opacity var(--anim) var(--ease),
      transform var(--anim) var(--ease),
      height var(--anim) var(--ease),
      margin-bottom var(--anim) var(--ease),
      padding-top var(--anim) var(--ease),
      padding-bottom var(--anim) var(--ease),
      border-left-color var(--anim) var(--ease);
  }
  .qtext { font-size: 19px; line-height: 1.4; font-weight: 500; transition: color var(--anim) var(--ease); }
  .qmark {
    position: absolute; top: 14px; right: 14px;
    color: var(--ok); font-size: 17px; font-weight: 700;
    opacity: 0; transform: scale(.5);
    transition: opacity var(--anim) var(--ease), transform var(--anim) var(--ease);
  }
  .qanswer {
    max-height: 0; opacity: 0; overflow: hidden;
    font-size: 14.5px; line-height: 1.45; color: var(--ok);
    transition: max-height var(--anim) var(--ease), opacity var(--anim) var(--ease),
                margin-top var(--anim) var(--ease), padding-top var(--anim) var(--ease);
  }

  /* nouvelle question : apparition en fondu depuis le bas */
  ul.qlist li.entering { opacity: 0; transform: translateY(14px); }

  /* question répondue : coche verte + réponse, avant disparition */
  ul.qlist li.answered { border-left-color: var(--ok); padding-right: 40px; }
  ul.qlist li.answered .qtext { color: var(--dim); }
  ul.qlist li.answered .qmark { opacity: 1; transform: scale(1); }
  ul.qlist li.answered .qanswer {
    max-height: 200px; opacity: 1;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed rgba(63,185,80,.3);
  }

  /* question obsolète : fondu discret */
  ul.qlist li.obsolete { opacity: .25; border-left-color: var(--border); }

  /* sortie : la carte glisse, la hauteur se referme (rien ne saute) */
  ul.qlist li.leaving {
    height: 0 !important;
    margin-bottom: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    border-top-width: 0; border-bottom-width: 0;
    opacity: 0;
    transform: translateX(28px);
  }

  @media (prefers-reduced-motion: reduce) {
    .dot.rec, #analyzing .pulse { animation: none; }
    ul.qlist li, .qtext, .qmark, .qanswer, #analyzing { transition-duration: 1ms; }
  }

  .placeholder {
    color: var(--faint); font-size: 15px; font-style: italic;
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: 12px; padding: 20px 16px; text-align: center;
  }

  /* ---------------- Réponses obtenues ---------------- */
  .fold-toggle {
    background: none; border: none; color: var(--dim);
    font-family: inherit; font-size: 13.5px; cursor: pointer;
    padding: 10px 0; display: flex; align-items: center; gap: 8px; width: 100%;
  }
  .fold-toggle .chev { font-size: 10px; color: var(--faint); transition: transform .18s var(--ease); }
  .fold-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .fold-toggle .tick { color: var(--ok); font-weight: 700; }
  ul.answers { list-style: none; margin: 0 0 6px; padding: 0; }
  ul.answers li {
    border-left: 2px solid var(--border); padding: 0 0 0 12px; margin-bottom: 14px;
  }
  ul.answers .aq { font-size: 14px; color: var(--faint); line-height: 1.4; }
  ul.answers .aa { font-size: 15px; color: var(--text); line-height: 1.45; margin-top: 3px; }

  /* ---------------- Transcription ---------------- */
  details.tr { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin: 18px 0 0; }
  details.tr > summary {
    list-style: none; cursor: pointer; padding: 13px 15px; font-size: 13.5px;
    color: var(--dim); display: flex; align-items: center; gap: 9px;
  }
  details.tr > summary::-webkit-details-marker { display: none; }
  details.tr > summary .chev { font-size: 10px; color: var(--faint); transition: transform .18s var(--ease); }
  details.tr[open] > summary .chev { transform: rotate(90deg); }
  details.tr > summary .count { margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  #transcript {
    margin: 0 12px 12px; padding: 12px; background: var(--bg);
    border: 1px solid var(--border-soft); border-radius: 9px;
    max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-size: 14px; line-height: 1.55; overscroll-behavior: contain;
  }
  #transcript p { margin: 0 0 8px; }
  #transcript p:last-child { margin-bottom: 0; }
  .ts { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; margin-right: 6px; user-select: none; }
  .interim { color: var(--faint); font-style: italic; }

  /* ---------------- Messages / boutons ---------------- */
  .msg { border-radius: 10px; padding: 11px 13px; font-size: 13.5px; line-height: 1.5; margin-bottom: 12px; border: 1px solid; }
  .msg.err  { background: rgba(248,81,73,.09);  border-color: rgba(248,81,73,.35);  color: #ffb4ae; }
  .msg.warn { background: rgba(210,153,34,.09); border-color: rgba(210,153,34,.35); color: #e3b341; }
  .msg.info { background: rgba(88,166,255,.08); border-color: rgba(88,166,255,.3);  color: #a5d0ff; }
  .msg:empty { display: none; }
  .msg b { font-weight: 680; }
  .msg .acts { display: flex; gap: 8px; margin-top: 10px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    border-radius: 11px; padding: 11px 15px; min-height: 44px; cursor: pointer;
  }
  .btn:active { background: var(--surface-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
  .btn.wide { width: 100%; }
  .btn-row { display: flex; gap: 9px; }
  .btn-row .btn { flex: 1; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 10px 14px calc(10px + var(--safe-b));
    background: rgba(13,17,23,.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .bar .btn { width: 100%; min-height: 52px; font-size: 16px; font-weight: 680; border-radius: 12px; }
  #endBtn { border-color: rgba(248,81,73,.45); color: #ff9d97; }
  #endBtn:disabled { border-color: var(--border); color: var(--faint); }

  .spin {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.28); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ---------------- Modales / plein écran ---------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(5,7,10,.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; width: 100%; max-width: 420px; }
  .sheet h2 { margin: 0 0 8px; font-size: 18px; font-weight: 650; }
  .sheet p { margin: 0 0 16px; font-size: 14px; color: var(--dim); line-height: 1.5; }
  .sheet input[type=password] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 16px;
    padding: 12px 13px; margin-bottom: 12px; appearance: none; -webkit-appearance: none;
  }
  .sheet input:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(88,166,255,.14); }

  #summaryView {
    position: fixed; inset: 0; z-index: 90; background: var(--bg);
    display: flex; flex-direction: column; padding: calc(var(--safe-t) + 14px) 0 0;
  }
  #summaryView .sv-head { display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; border-bottom: 1px solid var(--border); }
  #summaryView .sv-head h2 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
  #summaryView .sv-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px; font-size: 15.5px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
  }
  #summaryView .sv-body h3 { margin: 22px 0 7px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
  #summaryView .sv-body h3:first-child { margin-top: 0; }
  #summaryView .sv-foot {
    padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 9px; background: var(--surface);
  }
  .center-load { text-align: center; color: var(--dim); padding: 40px 20px; font-size: 15px; }
</style>
</head>
<body>

<div class="msg err"  id="fatalMsg"></div>
<div class="msg warn" id="micMsg"></div>
<div class="msg info" id="resumeMsg"></div>

<div class="topic-wrap">
  <input type="text" id="topic" placeholder="Sujet de la réunion (optionnel)" autocomplete="off" enterkeyhint="done">
</div>

<div class="listen-row">
  <button id="listenBtn"><span class="ico">🎙</span><span id="listenLabel">Écouter</span></button>
  <div class="meta">
    <div class="live"><span class="dot" id="dot"></span><span id="liveLabel">Prêt</span></div>
    <div id="chrono">00:00</div>
  </div>
</div>

<div class="sec-head">
  <span class="ttl">Questions à poser</span>
  <span id="analyzing"><span class="pulse">●</span> analyse…</span>
  <span class="spacer"></span>
  <button class="icon-btn" id="refreshQ" title="Analyser maintenant" aria-label="Analyser maintenant">↻</button>
</div>

<ul class="qlist" id="qList"></ul>
<div class="placeholder" id="qPlaceholder">Appuie sur <b>Écouter</b> — les questions se mettent à jour toutes seules.</div>

<button class="fold-toggle" id="ansToggle" aria-expanded="false" hidden>
  <span class="chev">▶</span><span class="tick">✓</span><span id="ansLabel">Réponses obtenues</span>
</button>
<ul class="answers" id="ansList" hidden></ul>

<details class="tr" id="trDetails">
  <summary><span class="chev">▶</span><span>Voir la transcription</span><span class="count" id="trCount">0</span></summary>
  <div id="transcript"></div>
</details>

<nav class="bar">
  <button class="btn" id="endBtn" disabled>■ Terminer la réunion</button>
</nav>

<div class="overlay" id="pwOverlay" hidden>
  <div class="sheet">
    <h2>Mot de passe</h2>
    <p id="pwText">Saisis le mot de passe de l’application. Il sera mémorisé sur ce téléphone.</p>
    <input type="password" id="pwInput" autocomplete="current-password" enterkeyhint="go" placeholder="••••••••">
    <div class="msg err" id="pwErr"></div>
    <button class="btn primary wide" id="pwBtn">Valider</button>
  </div>
</div>

<div id="summaryView" hidden>
  <div class="sv-head">
    <h2>Bilan de la réunion</h2>
    <button class="icon-btn" id="closeSummary" aria-label="Fermer">✕</button>
  </div>
  <div class="sv-body" id="summaryBody"></div>
  <div class="sv-foot">
    <div class="btn-row">
      <button class="btn" id="copyBtn">📋 Copier</button>
      <button class="btn" id="dlBtn">⬇ Télécharger .md</button>
    </div>
    <button class="btn wide" id="newBtn">Nouvelle réunion</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function mmss(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }

  /* ----------------------- localStorage (try/catch) ---------------------- */
  const LS_PW = 'mc.pw.v2';
  const LS_TOPIC = 'mc.topic.v2';
  const LS_MEETING = 'mc.meeting.v3';

  function lsGet(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignoré */ } }

  /* ------------------------------- Réglages ------------------------------ */
  const LIVE_MIN_INTERVAL = 12000;  // au plus 1 appel toutes les 12 s
  const LIVE_MIN_NEW_CHARS = 80;    // …et seulement après ~80 nouveaux caractères
  const LIVE_TAIL_CHARS = 4000;     // on n'envoie que la fin de la transcription
  const TARGET_QUESTIONS = 3;
  const ANSWER_HOLD_MS = 2000;      // la réponse reste lisible 2 s
  const ANIM_MS = 300;

  /* -------------------------------- État --------------------------------- */
  const state = {
    listening: false, started: false, ended: false,
    segments: [], interim: '',
    questions: [],        // actives  : { id, text, at }
    answers: [],          // répondues: { id, text, answer, at }
    retired: [],          // textes des questions devenues obsolètes (anti-doublon)
    elapsedMs: 0, lastResume: 0,
    chronoTimer: null, liveTimer: null, restartTimer: null,
    wakeLock: null, recognition: null,
    manualStop: false, errorStreak: 0,
    liveLoading: false, livePending: false, lastCallAt: 0, lastChars: 0,
    summaryText: '', password: '', supported: false
  };

  let qSeq = 0;
  const nextId = () => 'q' + (++qSeq);

  /* ============================ MOT DE PASSE ============================= */
  let pwResolve = null;

  function askPassword(reason) {
    $('pwText').textContent = reason ||
      'Saisis le mot de passe de l’application. Il sera mémorisé sur ce téléphone.';
    $('pwErr').innerHTML = '';
    $('pwInput').value = '';
    $('pwOverlay').hidden = false;
    setTimeout(() => $('pwInput').focus(), 80);
    return new Promise((resolve) => { pwResolve = resolve; });
  }

  function submitPassword() {
    const v = $('pwInput').value;
    if (!v) { $('pwErr').textContent = 'Saisis un mot de passe.'; return; }
    state.password = v;
    lsSet(LS_PW, v);
    $('pwOverlay').hidden = true;
    if (pwResolve) { const r = pwResolve; pwResolve = null; r(v); }
  }
  $('pwBtn').addEventListener('click', submitPassword);
  $('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitPassword(); } });

  /* ============================== APPELS API ============================= */
  async function callApi(payload, allowRetry) {
    if (!state.password) {
      await askPassword('Saisis le mot de passe de l’application pour activer le copilote.');
    }
    let res;
    try {
      res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-app-password': state.password },
        body: JSON.stringify(Object.assign({ topic: $('topic').value.trim() }, payload))
      });
    } catch (e) {
      throw new Error('Serveur injoignable — vérifie ta connexion.');
    }

    let data = null;
    try { data = await res.json(); } catch (e) { /* non JSON */ }

    if (res.status === 401) {
      state.password = '';
      lsDel(LS_PW);
      if (allowRetry !== false) {
        await askPassword('Mot de passe refusé. Saisis celui défini dans APP_PASSWORD sur Vercel.');
        return callApi(payload, false);
      }
      throw new Error('Mot de passe refusé.');
    }
    if (!res.ok) {
      const err = new Error((data && data.error) || ('Erreur serveur ' + res.status + '.'));
      err.status = res.status;
      throw err;
    }
    if (!data) throw new Error('Réponse vide du serveur.');
    return data;
  }

  /* ============================ TRANSCRIPTION =========================== */
  const transcriptEl = $('transcript');
  let interimEl = null;

  const elapsedNow = () => state.elapsedMs + (state.listening ? Date.now() - state.lastResume : 0);
  const fullText = () => state.segments.map((s) => '[' + mmss(s.t) + '] ' + s.text).join('\n');
  const tailText = () => fullText().slice(-LIVE_TAIL_CHARS);
  const plainChars = () => state.segments.reduce((n, s) => n + s.text.length, 0);
  const nearBottom = () => transcriptEl.scrollHeight - transcriptEl.scrollTop - transcriptEl.clientHeight < 60;

  function initTranscriptDom() {
    transcriptEl.innerHTML = '';
    interimEl = document.createElement('p');
    interimEl.className = 'interim';
    interimEl.style.display = 'none';
    transcriptEl.appendChild(interimEl);
  }

  function segmentNode(seg) {
    const p = document.createElement('p');
    p.innerHTML = '<span class="ts">[' + mmss(seg.t) + ']</span>' + esc(seg.text);
    return p;
  }

  function addSegment(text) {
    const clean = text.replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const seg = { t: elapsedNow(), text: clean };
    state.segments.push(seg);
    const stick = nearBottom();
    transcriptEl.insertBefore(segmentNode(seg), interimEl);
    if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
    $('trCount').textContent = state.segments.length;
    persist();
    maybeAnalyze();          // une phrase finale vient d'arriver
  }

  function setInterim(text) {
    state.interim = text;
    if (!interimEl) return;
    if (text) {
      const stick = nearBottom();
      interimEl.textContent = text;
      interimEl.style.display = '';
      if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
    } else {
      interimEl.textContent = '';
      interimEl.style.display = 'none';
    }
  }

  function renderTranscript() {
    initTranscriptDom();
    const frag = document.createDocumentFragment();
    state.segments.forEach((s) => frag.appendChild(segmentNode(s)));
    transcriptEl.insertBefore(frag, interimEl);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    $('trCount').textContent = state.segments.length;
  }

  /* ====================== QUESTIONS : rendu & animations ================= */
  const qList = $('qList');

  function cardNode(q) {
    const li = document.createElement('li');
    li.dataset.id = q.id;
    li.innerHTML =
      '<span class="qmark">✓</span>' +
      '<div class="qtext">' + esc(q.text) + '</div>' +
      '<div class="qanswer"></div>';
    return li;
  }

  const cardById = (id) => qList.querySelector('li[data-id="' + id + '"]');

  function addCard(q, animate) {
    const li = cardNode(q);
    if (animate) li.classList.add('entering');
    qList.appendChild(li);
    if (animate) {
      // Double rAF : la classe de départ doit être peinte avant d'être retirée.
      requestAnimationFrame(() => requestAnimationFrame(() => li.classList.remove('entering')));
    }
    updatePlaceholder();
  }

  // Referme la carte en douceur : la hauteur passe à 0, les voisines ne sautent pas.
  function collapseCard(li, done) {
    if (!li || li.dataset.leaving) { if (done) done(); return; }
    li.dataset.leaving = '1';
    li.style.height = li.offsetHeight + 'px';
    void li.offsetHeight;                      // force le reflow
    li.classList.add('leaving');
    setTimeout(() => { li.remove(); updatePlaceholder(); if (done) done(); }, ANIM_MS + 40);
  }

  function markAnswered(id, answer) {
    const li = cardById(id);
    if (!li) return;
    const ans = li.querySelector('.qanswer');
    if (ans) ans.textContent = answer;
    li.classList.add('answered');
    setTimeout(() => collapseCard(li), ANSWER_HOLD_MS);
  }

  function markObsolete(id) {
    const li = cardById(id);
    if (!li) return;
    li.classList.add('obsolete');
    setTimeout(() => collapseCard(li), ANIM_MS);
  }

  function updatePlaceholder() {
    $('qPlaceholder').hidden = state.questions.length > 0 || qList.children.length > 0;
  }

  function renderQuestions() {
    qList.innerHTML = '';
    state.questions.forEach((q) => qList.appendChild(cardNode(q)));
    updatePlaceholder();
  }

  /* ------------------------- Réponses obtenues --------------------------- */
  function renderAnswers() {
    const n = state.answers.length;
    $('ansToggle').hidden = n === 0;
    $('ansLabel').textContent = 'Réponses obtenues (' + n + ')';
    $('ansList').innerHTML = state.answers.map((a) =>
      '<li><div class="aq">' + esc(a.text) + '</div><div class="aa">' + esc(a.answer) + '</div></li>'
    ).join('');
    if (n === 0) {
      $('ansList').hidden = true;
      $('ansToggle').setAttribute('aria-expanded', 'false');
    } else {
      $('ansList').hidden = $('ansToggle').getAttribute('aria-expanded') !== 'true';
    }
  }

  $('ansToggle').addEventListener('click', () => {
    const open = $('ansToggle').getAttribute('aria-expanded') === 'true';
    $('ansToggle').setAttribute('aria-expanded', open ? 'false' : 'true');
    $('ansList').hidden = open;
  });

  /* ========================== CYCLE TEMPS RÉEL ========================== */
  function setAnalyzing(on) { $('analyzing').classList.toggle('on', on); }

  function buzz() {
    try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) { /* ignoré */ }
  }

  function knownTexts() {
    return state.answers.map((a) => a.text)
      .concat(state.retired)
      .concat(state.questions.map((q) => q.text));
  }

  function applyLive(data) {
    const answered = Array.isArray(data.answered) ? data.answered : [];
    const obsolete = Array.isArray(data.obsolete) ? data.obsolete : [];
    const fresh = Array.isArray(data.new) ? data.new : [];

    // 1. Répondues : coche + réponse affichée, puis la carte se retire.
    answered.forEach((a) => {
      const q = state.questions.find((x) => x.id === a.id);
      if (!q) return;
      state.questions = state.questions.filter((x) => x.id !== a.id);
      state.answers.push({ id: q.id, text: q.text, answer: a.answer, at: Date.now() });
      markAnswered(a.id, a.answer);
    });

    // 2. Obsolètes : fondu discret.
    obsolete.forEach((id) => {
      const q = state.questions.find((x) => x.id === id);
      if (!q) return;
      state.questions = state.questions.filter((x) => x.id !== id);
      state.retired.push(q.text);
      markObsolete(id);
    });

    // 3. Nouvelles : on complète jusqu'à TARGET_QUESTIONS, sans doublon.
    const seen = knownTexts().map((t) => t.toLowerCase());
    let added = 0;
    fresh.forEach((text) => {
      if (state.questions.length >= TARGET_QUESTIONS) return;
      const key = text.toLowerCase();
      if (seen.indexOf(key) !== -1) return;
      seen.push(key);
      const q = { id: nextId(), text: text, at: Date.now() };
      state.questions.push(q);
      addCard(q, true);
      added++;
    });

    if (answered.length) renderAnswers();
    if (added) buzz();
    if (answered.length || obsolete.length || added) persist();
  }

  async function runLive() {
    state.liveLoading = true;
    state.livePending = false;
    const charsAtCall = plainChars();
    setAnalyzing(true);
    try {
      const data = await callApi({
        mode: 'live',
        transcript: tailText(),
        questions: state.questions.map((q) => ({ id: q.id, text: q.text })),
        answered: state.answers.map((a) => a.text).concat(state.retired)
      });
      applyLive(data || {});
      state.lastChars = charsAtCall;
    } catch (e) {
      // En réunion, une erreur d'analyse ne doit rien casser à l'écran.
      state.lastChars = charsAtCall;
    } finally {
      state.lastCallAt = Date.now();
      state.liveLoading = false;
      setAnalyzing(false);
      if (state.livePending) {
        state.livePending = false;
        setTimeout(maybeAnalyze, 50);
      }
    }
  }

  // Un appel part quand : phrase finale transcrite + ~80 nouveaux caractères
  // + 12 s depuis le dernier appel. Jamais deux en parallèle.
  let gateTimer = null;

  function maybeAnalyze(force) {
    if (!state.supported && !force) return;
    if (state.liveLoading) { state.livePending = true; return; }
    const chars = plainChars();
    if (!force) {
      if (!state.listening) return;
      if (chars - state.lastChars < LIVE_MIN_NEW_CHARS) return;
      const wait = LIVE_MIN_INTERVAL - (Date.now() - state.lastCallAt);
      if (wait > 0) {
        // Le texte est prêt mais la fenêtre n'est pas ouverte : on arme un
        // rappel pour l'instant exact où elle s'ouvre, sans attendre le tick.
        clearTimeout(gateTimer);
        gateTimer = setTimeout(() => maybeAnalyze(), wait + 20);
        return;
      }
    }
    if (chars < 40) return;
    clearTimeout(gateTimer);
    runLive();
  }

  $('refreshQ').addEventListener('click', () => maybeAnalyze(true));

  function showMsg(id, html, hideMs) {
    const el = $(id);
    el.innerHTML = html || '';
    if (hideMs && html) setTimeout(() => { if (el.innerHTML === html) el.innerHTML = ''; }, hideMs);
  }

  /* =========================== RECONNAISSANCE =========================== */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function checkSupport() {
    if (!SR) {
      showMsg('fatalMsg',
        '<b>Transcription indisponible sur ce navigateur.</b><br>' +
        'Ouvre cette page dans <b>Chrome (Android)</b> ou <b>Safari (iOS)</b>. ' +
        'Firefox et les navigateurs intégrés aux applications (Instagram, LinkedIn, Gmail) ' +
        'ne gèrent pas la reconnaissance vocale.');
      $('listenBtn').disabled = true;
      return false;
    }
    if (!window.isSecureContext) {
      showMsg('fatalMsg', '<b>Connexion non sécurisée.</b> Le micro exige HTTPS.');
      $('listenBtn').disabled = true;
      return false;
    }
    state.supported = true;
    return true;
  }

  function buildRecognition() {
    const rec = new SR();
    rec.lang = 'fr-FR';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = (event) => {
      state.errorStreak = 0;
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const r = event.results[i];
        const txt = r[0] ? r[0].transcript : '';
        if (r.isFinal) addSegment(txt); else interim += txt;
      }
      setInterim(interim.trim());
    };

    rec.onerror = (event) => {
      const err = event.error;
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        stopListening();
        showMsg('micMsg',
          '<b>Accès au micro refusé.</b> Autorise le microphone pour ce site, puis réappuie sur Écouter.<br>' +
          'iOS : Réglages → Safari → Microphone. Android : ⓘ dans la barre d’adresse → Autorisations.');
        return;
      }
      if (err === 'audio-capture') {
        stopListening();
        showMsg('micMsg', '<b>Micro introuvable.</b> Vérifie qu’aucune autre app ne l’utilise.');
        return;
      }
      if (err === 'no-speech' || err === 'aborted') return;
      state.errorStreak++;
    };

    rec.onend = () => {
      if (!state.listening || state.manualStop) return;
      const delay = state.errorStreak > 3 ? Math.min(400 * state.errorStreak, 5000) : 250;
      clearTimeout(state.restartTimer);
      state.restartTimer = setTimeout(() => {
        if (!state.listening || state.manualStop) return;
        try { rec.start(); } catch (e) {
          if (!/already/i.test(e && e.message ? e.message : '')) {
            state.restartTimer = setTimeout(() => { try { rec.start(); } catch (e2) { /* ignoré */ } }, 1200);
          }
        }
      }, delay);
    };
    return rec;
  }

  async function startListening() {
    if (!state.supported) return;
    if (!state.password) {
      await askPassword('Saisis le mot de passe de l’application pour activer le copilote.');
    }
    showMsg('micMsg', '');
    showMsg('resumeMsg', '');
    state.manualStop = false;
    state.errorStreak = 0;
    if (!state.recognition) state.recognition = buildRecognition();
    try { state.recognition.start(); }
    catch (e) {
      if (!/already/i.test(e && e.message ? e.message : '')) {
        showMsg('micMsg', 'Démarrage du micro impossible : ' + esc(e.message || 'erreur inconnue'));
        return;
      }
    }
    state.listening = true;
    state.started = true;
    state.ended = false;
    state.lastResume = Date.now();
    startChrono();
    requestWakeLock();
    clearInterval(state.liveTimer);
    // Relance périodique : rattrape le cas « assez de texte, mais délai non écoulé ».
    state.liveTimer = setInterval(() => maybeAnalyze(), 2000);
    $('endBtn').disabled = false;
    $('topic').disabled = true;
    updateUi();
    persist();
  }

  function stopListening() {
    if (state.listening) { state.elapsedMs = elapsedNow(); state.listening = false; }
    state.manualStop = true;
    clearTimeout(state.restartTimer);
    clearTimeout(gateTimer);
    clearInterval(state.liveTimer);
    if (state.recognition) { try { state.recognition.stop(); } catch (e) { /* ignoré */ } }
    setInterim('');
    stopChrono();
    releaseWakeLock();
    updateUi();
    persist();
  }

  /* ============================ CHRONO / WAKE =========================== */
  function startChrono() {
    clearInterval(state.chronoTimer);
    const tick = () => { $('chrono').textContent = mmss(elapsedNow()); };
    tick();
    state.chronoTimer = setInterval(tick, 1000);
  }
  function stopChrono() {
    clearInterval(state.chronoTimer);
    $('chrono').textContent = mmss(elapsedNow());
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      state.wakeLock = await navigator.wakeLock.request('screen');
      state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
    } catch (e) { state.wakeLock = null; }
  }
  function releaseWakeLock() {
    if (state.wakeLock) { try { state.wakeLock.release(); } catch (e) { /* ignoré */ } state.wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.listening) {
      requestWakeLock();
      if (state.recognition && !state.manualStop) {
        try { state.recognition.start(); } catch (e) { /* déjà active */ }
      }
    }
  });

  /* ================================ UI ================================== */
  function updateUi() {
    const dot = $('dot');
    dot.className = 'dot' + (state.listening ? ' rec' : (state.started && !state.ended ? ' paused' : ''));
    $('liveLabel').textContent = state.listening ? 'Écoute en cours'
      : (state.ended ? 'Terminée' : (state.started ? 'En pause' : 'Prêt'));
    $('listenBtn').classList.toggle('on', state.listening);
    $('listenBtn').querySelector('.ico').textContent = state.listening ? '⏸' : '🎙';
    $('listenLabel').textContent = state.listening ? 'Pause' : (state.started ? 'Reprendre' : 'Écouter');
  }

  $('listenBtn').addEventListener('click', () => {
    if (state.listening) stopListening(); else startListening();
  });
  $('topic').addEventListener('change', () => lsSet(LS_TOPIC, $('topic').value.trim()));

  /* ============================ PERSISTANCE ============================= */
  let persistTimer = null;
  function cancelPersist() { clearTimeout(persistTimer); persistTimer = null; }
  function persist() {
    if (persistTimer) return;
    persistTimer = setTimeout(() => {
      persistTimer = null;
      lsSet(LS_MEETING, {
        segments: state.segments.slice(-4000),
        questions: state.questions,
        answers: state.answers.slice(-200),
        retired: state.retired.slice(-200),
        elapsedMs: elapsedNow(),
        started: state.started,
        ended: state.ended,
        summaryText: state.summaryText,
        topic: $('topic').value.trim(),
        savedAt: Date.now()
      });
    }, 1000);
  }

  function loadMeeting(m) {
    state.segments = Array.isArray(m.segments) ? m.segments : [];
    state.questions = Array.isArray(m.questions) ? m.questions : [];
    state.answers = Array.isArray(m.answers) ? m.answers : [];
    state.retired = Array.isArray(m.retired) ? m.retired : [];
    state.elapsedMs = m.elapsedMs || 0;
    state.started = !!m.started;
    state.ended = !!m.ended;
    state.summaryText = m.summaryText || '';
    qSeq = state.questions.concat(state.answers)
      .reduce((n, q) => Math.max(n, parseInt(String(q.id || '').replace(/\D/g, ''), 10) || 0), 0);
    state.lastChars = plainChars();
    if (m.topic) $('topic').value = m.topic;
    renderTranscript();
    renderQuestions();
    renderAnswers();
    $('chrono').textContent = mmss(state.elapsedMs);
    $('endBtn').disabled = !state.segments.length;
    updateUi();
  }

  /* ================================ BILAN =============================== */
  const HEADINGS = [
    'RÉSUMÉ', 'RESUME',
    'POINTS CLÉS & INFORMATIONS OBTENUES', 'POINTS CLES & INFORMATIONS OBTENUES',
    'POINTS CLÉS ET INFORMATIONS OBTENUES', 'POINTS CLES ET INFORMATIONS OBTENUES',
    'DÉCISIONS PRISES', 'DECISIONS PRISES',
    'ACTIONS À FAIRE', 'ACTIONS A FAIRE',
    'QUESTIONS & RÉPONSES OBTENUES', 'QUESTIONS & REPONSES OBTENUES',
    'QUESTIONS ET RÉPONSES OBTENUES', 'QUESTIONS ET REPONSES OBTENUES',
    'QUESTIONS RESTÉES SANS RÉPONSE / POINTS OUVERTS',
    'QUESTIONS RESTEES SANS REPONSE / POINTS OUVERTS',
    'QUESTIONS RESTÉES SANS RÉPONSE', 'QUESTIONS RESTEES SANS REPONSE',
    'OÙ ON EN EST', 'OU ON EN EST',
    'PROCHAINE ÉTAPE RECOMMANDÉE', 'PROCHAINE ETAPE RECOMMANDEE'
  ];

  const isHeading = (line) => {
    const t = line.trim().replace(/^#+\s*/, '').replace(/\*\*/g, '').replace(/\s*:$/, '');
    return HEADINGS.indexOf(t.toUpperCase()) !== -1 ? t.toUpperCase() : null;
  };

  function renderSummary(text) {
    const lines = text.split('\n');
    const out = [];
    lines.forEach((line, i) => {
      const head = isHeading(line);
      if (head) { out.push('<h3>' + esc(head) + '</h3>'); return; }
      if (!line.trim()) {
        const prev = i > 0 ? lines[i - 1] : '';
        let next = '';
        for (let j = i + 1; j < lines.length; j++) { if (lines[j].trim()) { next = lines[j]; break; } }
        if (isHeading(prev) || isHeading(next)) return;
      }
      out.push(esc(line));
    });
    $('summaryBody').innerHTML = out.join('\n');
  }

  async function endMeeting() {
    stopListening();
    state.ended = true;
    updateUi();
    $('summaryView').hidden = false;
    $('summaryBody').innerHTML = '<div class="center-load"><span class="spin"></span><br><br>Génération du bilan…</div>';
    $('copyBtn').disabled = true;
    $('dlBtn').disabled = true;
    try {
      const data = await callApi({
        mode: 'summary',
        transcript: fullText(),
        qa: state.answers.map((a) => ({ question: a.text, answer: a.answer })),
        open: state.questions.map((q) => q.text)
      });
      state.summaryText = (data && data.text) || '';
      if (!state.summaryText) throw new Error('Réponse vide du serveur.');
      renderSummary(state.summaryText);
      $('copyBtn').disabled = false;
      $('dlBtn').disabled = false;
      persist();
    } catch (e) {
      $('summaryBody').innerHTML =
        '<div class="msg err"><b>Bilan non généré.</b><br>' + esc(e.message) + '</div>' +
        '<button class="btn wide" id="retrySum">Réessayer</button>';
      const r = $('retrySum');
      if (r) r.addEventListener('click', endMeeting);
    }
  }
  $('endBtn').addEventListener('click', endMeeting);
  $('closeSummary').addEventListener('click', () => { $('summaryView').hidden = true; });

  /* ============================== EXPORTS =============================== */
  function buildMarkdown() {
    const topic = $('topic').value.trim();
    const lines = [
      '# Bilan de réunion',
      '',
      '- **Date** : ' + new Date().toLocaleString('fr-FR'),
      '- **Durée** : ' + mmss(elapsedNow()),
      '- **Sujet** : ' + (topic || 'non précisé'),
      '',
      '---',
      '',
      state.summaryText || 'non précisé',
      '',
      '---',
      '',
      '## Questions & réponses obtenues',
      ''
    ];
    lines.push(state.answers.length
      ? state.answers.map((a) => '- **' + a.text + '**\n  → ' + a.answer).join('\n')
      : '_Aucune question n’a reçu de réponse._');

    lines.push('', '## Questions restées sans réponse', '');
    lines.push(state.questions.length
      ? state.questions.map((q) => '- ' + q.text).join('\n')
      : '_Aucune._');

    lines.push('', '---', '', '## Transcription complète', '', fullText() || '_Vide._', '');
    return lines.join('\n');
  }

  function stamp() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  $('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(buildMarkdown());
      $('copyBtn').textContent = '✅ Copié';
      setTimeout(() => { $('copyBtn').textContent = '📋 Copier'; }, 1800);
    } catch (e) { alert('Copie impossible — utilise le téléchargement.'); }
  });

  $('dlBtn').addEventListener('click', () => {
    try {
      const blob = new Blob([buildMarkdown()], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'reunion-' + stamp() + '.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { alert('Téléchargement impossible — utilise « Copier ».'); }
  });

  /* =========================== NOUVELLE RÉUNION ========================= */
  function resetMeeting() {
    stopListening();
    cancelPersist();
    state.segments = []; state.questions = []; state.answers = []; state.retired = [];
    state.summaryText = ''; state.elapsedMs = 0;
    state.started = false; state.ended = false;
    state.lastChars = 0; state.lastCallAt = 0;
    state.liveLoading = false; state.livePending = false;
    clearTimeout(gateTimer);
    state.recognition = null;
    qSeq = 0;
    lsDel(LS_MEETING);
    renderTranscript();
    renderQuestions();
    renderAnswers();
    setInterim('');
    setAnalyzing(false);
    $('chrono').textContent = '00:00';
    $('endBtn').disabled = true;
    $('topic').disabled = false;
    $('trDetails').open = false;
    $('summaryView').hidden = true;
    ['micMsg', 'resumeMsg', 'fatalMsg'].forEach((id) => showMsg(id, ''));
    checkSupport();
    updateUi();
  }

  $('newBtn').addEventListener('click', () => {
    if (!confirm('Effacer cette réunion et repartir de zéro ?\nLe bilan non téléchargé sera perdu.')) return;
    resetMeeting();
  });

  window.addEventListener('beforeunload', (e) => {
    if (state.listening || (state.segments.length && !state.summaryText)) {
      e.preventDefault(); e.returnValue = '';
    }
  });

  /* ============================== DÉMARRAGE ============================= */
  function boot() {
    initTranscriptDom();
    renderQuestions();
    renderAnswers();

    const savedTopic = lsGet(LS_TOPIC);
    if (savedTopic) $('topic').value = savedTopic;

    const pw = lsGet(LS_PW);
    if (pw) state.password = pw;

    const supported = checkSupport();

    const m = lsGet(LS_MEETING);
    const recent = m && m.savedAt && (Date.now() - m.savedAt < 12 * 3600 * 1000);
    const worthResuming = recent && Array.isArray(m.segments) && m.segments.length > 0;

    if (worthResuming) {
      const mins = Math.round((m.elapsedMs || 0) / 60000);
      showMsg('resumeMsg',
        '<b>Réunion non terminée retrouvée</b> — ' + m.segments.length + ' passages transcrits' +
        (mins ? ', ' + mins + ' min' : '') + '.' +
        '<div class="acts">' +
        '<button class="btn primary" id="resumeYes">Reprendre</button>' +
        '<button class="btn" id="resumeNo">Nouvelle réunion</button></div>');
      $('resumeYes').addEventListener('click', () => {
        loadMeeting(m);
        showMsg('resumeMsg', '');
        if (m.summaryText) { renderSummary(m.summaryText); $('summaryView').hidden = false; }
      });
      $('resumeNo').addEventListener('click', () => { showMsg('resumeMsg', ''); resetMeeting(); });
    } else {
      if (m) lsDel(LS_MEETING);
      updateUi();
    }

    if (!state.password && supported && !worthResuming) {
      askPassword('Saisis le mot de passe de l’application. Il sera mémorisé sur ce téléphone.');
    }
  }

  boot();
})();
</script>
</body>
</html>
