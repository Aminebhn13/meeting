<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Copilote de réunion : écoute, suggère les questions à poser, produit le bilan.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copilot">
<title>Meeting Copilot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<style>
  :root {
    --bg:          #0d1117;
    --surface:     #161b22;
    --surface-2:   #1c2129;
    --border:      #262c36;
    --border-soft: #21262d;
    --text:        #e6edf3;
    --dim:         #9198a1;
    --faint:       #6e7681;
    --accent:      #58a6ff;
    --accent-dim:  #1f6feb;
    --danger:      #f85149;
    --ok:          #3fb950;
    --warn:        #d29922;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --bar-h: 72px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* L'attribut hidden doit l'emporter sur nos display: flex/block. */
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
    padding: calc(var(--safe-t) + 10px) 14px calc(var(--bar-h) + var(--safe-b) + 20px);
    max-width: 720px; margin: 0 auto;
  }

  /* ---------------- Sujet ---------------- */
  .topic-wrap { margin-bottom: 18px; }
  #topic {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    padding: 13px 14px;
    appearance: none; -webkit-appearance: none;
  }
  #topic::placeholder { color: var(--faint); }
  #topic:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(88,166,255,.14); }
  #topic:disabled { opacity: .55; }

  /* ---------------- Bouton d'écoute ---------------- */
  .listen-row {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 22px;
  }
  #listenBtn {
    width: 96px; height: 96px; flex: none;
    border-radius: 50%;
    border: none;
    background: var(--accent-dim);
    color: #fff;
    font-family: inherit;
    font-size: 15px; font-weight: 700; line-height: 1.25;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 6px 20px rgba(31,111,235,.35);
    transition: transform .1s ease, background .15s ease, box-shadow .15s ease;
  }
  #listenBtn .ico { font-size: 26px; line-height: 1; }
  #listenBtn:active { transform: scale(.95); }
  #listenBtn.on {
    background: var(--surface-2);
    color: var(--text);
    box-shadow: 0 0 0 3px rgba(248,81,73,.3);
  }
  #listenBtn:disabled { opacity: .4; box-shadow: none; cursor: default; }

  .meta { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .live { display: flex; align-items: center; gap: 9px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.rec { background: var(--danger); animation: blink 1.15s ease-in-out infinite; }
  .dot.paused { background: var(--warn); }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .15 } }
  @media (prefers-reduced-motion: reduce) { .dot.rec { animation: none } }
  #chrono { font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  #liveLabel { font-size: 13px; color: var(--dim); }

  /* ---------------- Questions ---------------- */
  .sec-head {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .09em;
    color: var(--dim); text-transform: uppercase;
  }
  .sec-head .ttl { flex: 1; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--dim); border-radius: 9px;
    width: 38px; height: 38px; flex: none;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .icon-btn.busy { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  ul.qlist { list-style: none; margin: 0 0 14px; padding: 0; }
  ul.qlist li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 15px 16px;
    margin-bottom: 9px;
    font-size: 19px; line-height: 1.4; font-weight: 500;
    cursor: pointer;
    transition: opacity .15s ease, background .15s ease;
  }
  ul.qlist li:active { background: var(--surface-2); }
  ul.qlist li.asked {
    text-decoration: line-through;
    text-decoration-color: var(--faint);
    color: var(--faint);
    border-left-color: var(--ok);
    opacity: .6;
    font-weight: 400;
  }
  ul.qlist.old li {
    background: none;
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--border);
    color: var(--dim);
    font-size: 15px;
    font-weight: 400;
    padding: 11px 13px;
    margin-bottom: 7px;
  }
  ul.qlist.old li.asked { border-left-color: var(--ok); color: var(--faint); }

  .hist-toggle {
    background: none; border: none; color: var(--faint);
    font-family: inherit; font-size: 13px; cursor: pointer;
    padding: 6px 0; display: flex; align-items: center; gap: 7px;
  }
  .hist-toggle .chev { font-size: 10px; transition: transform .18s ease; }
  .hist-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

  .placeholder {
    color: var(--faint); font-size: 15px; font-style: italic;
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: 12px; padding: 20px 16px; text-align: center;
  }

  /* ---------------- Transcription ---------------- */
  details.tr {
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); margin: 20px 0 0;
  }
  details.tr > summary {
    list-style: none; cursor: pointer; padding: 13px 15px;
    font-size: 13.5px; color: var(--dim);
    display: flex; align-items: center; gap: 9px;
  }
  details.tr > summary::-webkit-details-marker { display: none; }
  details.tr > summary .chev { font-size: 10px; color: var(--faint); transition: transform .18s ease; }
  details.tr[open] > summary .chev { transform: rotate(90deg); }
  details.tr > summary .count { margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  #transcript {
    margin: 0 12px 12px; padding: 12px;
    background: var(--bg); border: 1px solid var(--border-soft); border-radius: 9px;
    max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-size: 14px; line-height: 1.55; overscroll-behavior: contain;
  }
  #transcript p { margin: 0 0 8px; }
  #transcript p:last-child { margin-bottom: 0; }
  .ts { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; margin-right: 6px; user-select: none; }
  .interim { color: var(--faint); font-style: italic; }

  /* ---------------- Messages ---------------- */
  .msg { border-radius: 10px; padding: 11px 13px; font-size: 13.5px; line-height: 1.5; margin-bottom: 12px; border: 1px solid; }
  .msg.err  { background: rgba(248,81,73,.09);  border-color: rgba(248,81,73,.35);  color: #ffb4ae; }
  .msg.warn { background: rgba(210,153,34,.09); border-color: rgba(210,153,34,.35); color: #e3b341; }
  .msg.info { background: rgba(88,166,255,.08); border-color: rgba(88,166,255,.3);  color: #a5d0ff; }
  .msg:empty { display: none; }
  .msg b { font-weight: 680; }
  .msg .acts { display: flex; gap: 8px; margin-top: 10px; }

  /* ---------------- Boutons ---------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    border-radius: 11px; padding: 11px 15px; min-height: 44px; cursor: pointer;
  }
  .btn:active { background: var(--surface-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
  .btn.wide { width: 100%; }
  .btn-row { display: flex; gap: 9px; }
  .btn-row .btn { flex: 1; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 10px 14px calc(10px + var(--safe-b));
    background: rgba(13,17,23,.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .bar .btn { width: 100%; min-height: 52px; font-size: 16px; font-weight: 680; border-radius: 12px; }
  #endBtn { border-color: rgba(248,81,73,.45); color: #ff9d97; }
  #endBtn:disabled { border-color: var(--border); color: var(--faint); }

  .spin {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.28); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }

  /* ---------------- Modales / plein écran ---------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,7,10,.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; width: 100%; max-width: 420px;
  }
  .sheet h2 { margin: 0 0 8px; font-size: 18px; font-weight: 650; }
  .sheet p { margin: 0 0 16px; font-size: 14px; color: var(--dim); line-height: 1.5; }
  .sheet input[type=password] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 16px;
    padding: 12px 13px; margin-bottom: 12px;
    appearance: none; -webkit-appearance: none;
  }
  .sheet input:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(88,166,255,.14); }

  /* Bilan plein écran */
  #summaryView {
    position: fixed; inset: 0; z-index: 90;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: calc(var(--safe-t) + 14px) 0 0;
  }
  #summaryView[hidden] { display: none; }
  #summaryView .sv-head {
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px 12px; border-bottom: 1px solid var(--border);
  }
  #summaryView .sv-head h2 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
  #summaryView .sv-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px; font-size: 15.5px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
  }
  #summaryView .sv-body h3 {
    margin: 22px 0 7px; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--accent);
  }
  #summaryView .sv-body h3:first-child { margin-top: 0; }
  #summaryView .sv-foot {
    padding: 12px 16px calc(12px + var(--safe-b));
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 9px;
    background: var(--surface);
  }
  .center-load { text-align: center; color: var(--dim); padding: 40px 20px; font-size: 15px; }
</style>
</head>
<body>

<div class="msg err"  id="fatalMsg"></div>
<div class="msg warn" id="micMsg"></div>
<div class="msg info" id="resumeMsg"></div>

<div class="topic-wrap">
  <input type="text" id="topic" placeholder="Sujet de la réunion (optionnel)" autocomplete="off" enterkeyhint="done">
</div>

<div class="listen-row">
  <button id="listenBtn"><span class="ico">🎙</span><span id="listenLabel">Écouter</span></button>
  <div class="meta">
    <div class="live"><span class="dot" id="dot"></span><span id="liveLabel">Prêt</span></div>
    <div id="chrono">00:00</div>
  </div>
</div>

<div class="sec-head">
  <span class="ttl">Questions à poser</span>
  <button class="icon-btn" id="refreshQ" title="Générer de nouvelles questions" aria-label="Générer de nouvelles questions">↻</button>
</div>

<div class="msg err" id="qErr"></div>

<ul class="qlist" id="qCurrent"></ul>
<div class="placeholder" id="qPlaceholder">Appuie sur <b>Écouter</b> — les questions apparaîtront ici.</div>

<button class="hist-toggle" id="histToggle" aria-expanded="false" hidden>
  <span class="chev">▶</span><span id="histLabel">Questions précédentes</span>
</button>
<ul class="qlist old" id="qHistory" hidden></ul>

<details class="tr" id="trDetails">
  <summary><span class="chev">▶</span><span>Voir la transcription</span><span class="count" id="trCount">0</span></summary>
  <div id="transcript"></div>
</details>

<nav class="bar">
  <button class="btn" id="endBtn" disabled>■ Terminer la réunion</button>
</nav>

<!-- Mot de passe : demandé une seule fois -->
<div class="overlay" id="pwOverlay" hidden>
  <div class="sheet">
    <h2>Mot de passe</h2>
    <p id="pwText">Saisis le mot de passe de l’application. Il sera mémorisé sur ce téléphone.</p>
    <input type="password" id="pwInput" autocomplete="current-password" enterkeyhint="go" placeholder="••••••••">
    <div class="msg err" id="pwErr"></div>
    <button class="btn primary wide" id="pwBtn">Valider</button>
  </div>
</div>

<!-- Bilan plein écran -->
<div id="summaryView" hidden>
  <div class="sv-head">
    <h2>Bilan de la réunion</h2>
    <button class="icon-btn" id="closeSummary" aria-label="Fermer">✕</button>
  </div>
  <div class="sv-body" id="summaryBody"></div>
  <div class="sv-foot">
    <div class="btn-row">
      <button class="btn" id="copyBtn">📋 Copier</button>
      <button class="btn" id="dlBtn">⬇ Télécharger .md</button>
    </div>
    <button class="btn wide" id="newBtn">Nouvelle réunion</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function mmss(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }

  /* ----------------------- localStorage (try/catch) ---------------------- */
  const LS_PW = 'mc.pw.v2';
  const LS_TOPIC = 'mc.topic.v2';
  const LS_MEETING = 'mc.meeting.v2';

  function lsGet(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignoré */ } }

  /* ------------------------------- Réglages ------------------------------ */
  const AUTO_INTERVAL_MS = 45000;   // génération automatique toutes les ~45 s
  const MIN_NEW_CHARS    = 150;     // …si au moins 150 nouveaux caractères
  const MIN_CHARS_FIRST  = 150;     // matière minimale avant la 1re génération

  /* -------------------------------- État --------------------------------- */
  const state = {
    listening: false, started: false, ended: false,
    segments: [], interim: '',
    questions: [],            // { id, text, at, asked }
    elapsedMs: 0, lastResume: 0,
    chronoTimer: null, autoTimer: null, restartTimer: null,
    wakeLock: null, recognition: null,
    manualStop: false, errorStreak: 0,
    qLoading: false, qLastChars: 0, qLastAt: 0,
    summaryText: '', password: '', supported: false
  };

  /* ============================ MOT DE PASSE ============================= */
  let pwResolve = null;

  function askPassword(reason) {
    $('pwText').textContent = reason ||
      'Saisis le mot de passe de l’application. Il sera mémorisé sur ce téléphone.';
    $('pwErr').innerHTML = '';
    $('pwInput').value = '';
    $('pwOverlay').hidden = false;
    setTimeout(() => $('pwInput').focus(), 80);
    return new Promise((resolve) => { pwResolve = resolve; });
  }

  function submitPassword() {
    const v = $('pwInput').value;
    if (!v) { $('pwErr').textContent = 'Saisis un mot de passe.'; return; }
    state.password = v;
    lsSet(LS_PW, v);
    $('pwOverlay').hidden = true;
    if (pwResolve) { const r = pwResolve; pwResolve = null; r(v); }
  }
  $('pwBtn').addEventListener('click', submitPassword);
  $('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitPassword(); } });

  /* ============================== APPELS API ============================= */
  async function callApi(payload, allowRetry) {
    if (!state.password) {
      await askPassword('Saisis le mot de passe de l’application pour activer le copilote.');
    }
    let res;
    try {
      res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-app-password': state.password },
        body: JSON.stringify(Object.assign({ topic: $('topic').value.trim() }, payload))
      });
    } catch (e) {
      throw new Error('Serveur injoignable — vérifie ta connexion.');
    }

    let data = null;
    try { data = await res.json(); } catch (e) { /* non JSON */ }

    if (res.status === 401) {
      // Mot de passe refusé : on le redemande, puis on retente une fois.
      state.password = '';
      lsDel(LS_PW);
      if (allowRetry !== false) {
        await askPassword('Mot de passe refusé. Saisis celui défini dans APP_PASSWORD sur Vercel.');
        return callApi(payload, false);
      }
      throw new Error('Mot de passe refusé.');
    }
    if (!res.ok) {
      const err = new Error((data && data.error) || ('Erreur serveur ' + res.status + '.'));
      err.status = res.status;
      throw err;
    }
    if (!data || !data.text) throw new Error('Réponse vide du serveur.');
    return data.text;
  }

  /* ============================ TRANSCRIPTION =========================== */
  const transcriptEl = $('transcript');
  let interimEl = null;

  const elapsedNow = () => state.elapsedMs + (state.listening ? Date.now() - state.lastResume : 0);
  const fullText = () => state.segments.map((s) => '[' + mmss(s.t) + '] ' + s.text).join('\n');
  const plainChars = () => state.segments.reduce((n, s) => n + s.text.length, 0);
  const nearBottom = () => transcriptEl.scrollHeight - transcriptEl.scrollTop - transcriptEl.clientHeight < 60;

  function initTranscriptDom() {
    transcriptEl.innerHTML = '';
    interimEl = document.createElement('p');
    interimEl.className = 'interim';
    interimEl.style.display = 'none';
    transcriptEl.appendChild(interimEl);
  }

  function segmentNode(seg) {
    const p = document.createElement('p');
    p.innerHTML = '<span class="ts">[' + mmss(seg.t) + ']</span>' + esc(seg.text);
    return p;
  }

  function addSegment(text) {
    const clean = text.replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const seg = { t: elapsedNow(), text: clean };
    state.segments.push(seg);
    const stick = nearBottom();
    transcriptEl.insertBefore(segmentNode(seg), interimEl);
    if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
    $('trCount').textContent = state.segments.length;
    persist();
  }

  function setInterim(text) {
    state.interim = text;
    if (!interimEl) return;
    if (text) {
      const stick = nearBottom();
      interimEl.textContent = text;
      interimEl.style.display = '';
      if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight;
    } else {
      interimEl.textContent = '';
      interimEl.style.display = 'none';
    }
  }

  function renderTranscript() {
    initTranscriptDom();
    const frag = document.createDocumentFragment();
    state.segments.forEach((s) => frag.appendChild(segmentNode(s)));
    transcriptEl.insertBefore(frag, interimEl);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    $('trCount').textContent = state.segments.length;
  }

  /* ============================== QUESTIONS ============================= */
  let qSeq = 0;

  function renderQuestions() {
    const all = state.questions.slice().sort((a, b) => b.at - a.at);
    const current = all.slice(0, 3);
    const older = all.slice(3);

    $('qPlaceholder').hidden = all.length > 0;
    $('qCurrent').innerHTML = current.map(liHtml).join('');

    const hasOld = older.length > 0;
    $('histToggle').hidden = !hasOld;
    $('histLabel').textContent = older.length + ' question' + (older.length > 1 ? 's' : '') + ' précédente' + (older.length > 1 ? 's' : '');
    $('qHistory').innerHTML = older.map(liHtml).join('');
    if (!hasOld) { $('qHistory').hidden = true; $('histToggle').setAttribute('aria-expanded', 'false'); }
    else { $('qHistory').hidden = $('histToggle').getAttribute('aria-expanded') !== 'true'; }
  }

  function liHtml(q) {
    return '<li data-id="' + q.id + '"' + (q.asked ? ' class="asked"' : '') + '>' + esc(q.text) + '</li>';
  }

  function toggleAsked(e) {
    const li = e.target.closest('li[data-id]');
    if (!li) return;
    const id = Number(li.dataset.id);
    const q = state.questions.find((x) => x.id === id);
    if (!q) return;
    q.asked = !q.asked;
    li.classList.toggle('asked', q.asked);
    persist();
  }
  $('qCurrent').addEventListener('click', toggleAsked);
  $('qHistory').addEventListener('click', toggleAsked);

  $('histToggle').addEventListener('click', () => {
    const open = $('histToggle').getAttribute('aria-expanded') === 'true';
    $('histToggle').setAttribute('aria-expanded', open ? 'false' : 'true');
    $('qHistory').hidden = open;
  });

  function parseQuestions(text) {
    return text.split('\n')
      .map((l) => l.trim().replace(/^[-–•*]\s*/, '').replace(/^\d+[.)]\s*/, '').trim())
      .filter((l) => l.length > 3)   // écarte les lignes parasites, garde « Qui ? »
      .slice(0, 3);
  }

  async function generateQuestions() {
    if (state.qLoading) return;
    const chars = plainChars();
    if (chars < MIN_CHARS_FIRST) {
      showMsg('qErr', 'Pas encore assez de matière — laisse la conversation démarrer.', 4000);
      return;
    }
    state.qLoading = true;
    showMsg('qErr', '');
    $('refreshQ').classList.add('busy');
    $('refreshQ').disabled = true;
    try {
      const out = await callApi({
        mode: 'questions',
        transcript: fullText(),
        proposed: state.questions.map((q) => q.text),
        asked: state.questions.filter((q) => q.asked).map((q) => q.text)
      });
      const now = Date.now();
      parseQuestions(out).forEach((text, i) => {
        state.questions.push({ id: ++qSeq, text, at: now + i, asked: false });
      });
      renderQuestions();
      persist();
    } catch (e) {
      showMsg('qErr', esc(e.message));
    } finally {
      state.qLoading = false;
      state.qLastChars = chars;
      state.qLastAt = Date.now();
      $('refreshQ').classList.remove('busy');
      $('refreshQ').disabled = false;
    }
  }
  $('refreshQ').addEventListener('click', generateQuestions);

  function autoTick() {
    if (!state.listening || state.qLoading) return;
    if (Date.now() - state.qLastAt < AUTO_INTERVAL_MS) return;
    const chars = plainChars();
    if (chars - state.qLastChars < MIN_NEW_CHARS) return;   // rien de neuf : pas d'appel
    if (chars < MIN_CHARS_FIRST) return;
    generateQuestions();
  }

  function showMsg(id, html, hideMs) {
    const el = $(id);
    el.innerHTML = html || '';
    if (hideMs && html) setTimeout(() => { if (el.innerHTML === html) el.innerHTML = ''; }, hideMs);
  }

  /* =========================== RECONNAISSANCE =========================== */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function checkSupport() {
    if (!SR) {
      showMsg('fatalMsg',
        '<b>Transcription indisponible sur ce navigateur.</b><br>' +
        'Ouvre cette page dans <b>Chrome (Android)</b> ou <b>Safari (iOS)</b>. ' +
        'Firefox et les navigateurs intégrés aux applications (Instagram, LinkedIn, Gmail) ' +
        'ne gèrent pas la reconnaissance vocale.');
      $('listenBtn').disabled = true;
      return false;
    }
    if (!window.isSecureContext) {
      showMsg('fatalMsg', '<b>Connexion non sécurisée.</b> Le micro exige HTTPS.');
      $('listenBtn').disabled = true;
      return false;
    }
    state.supported = true;
    return true;
  }

  function buildRecognition() {
    const rec = new SR();
    rec.lang = 'fr-FR';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = (event) => {
      state.errorStreak = 0;
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const r = event.results[i];
        const txt = r[0] ? r[0].transcript : '';
        if (r.isFinal) addSegment(txt); else interim += txt;
      }
      setInterim(interim.trim());
    };

    rec.onerror = (event) => {
      const err = event.error;
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        stopListening();
        showMsg('micMsg',
          '<b>Accès au micro refusé.</b> Autorise le microphone pour ce site, puis réappuie sur Écouter.<br>' +
          'iOS : Réglages → Safari → Microphone. Android : ⓘ dans la barre d’adresse → Autorisations.');
        return;
      }
      if (err === 'audio-capture') {
        stopListening();
        showMsg('micMsg', '<b>Micro introuvable.</b> Vérifie qu’aucune autre app ne l’utilise.');
        return;
      }
      if (err === 'no-speech' || err === 'aborted') return;
      state.errorStreak++;
    };

    // Les navigateurs mobiles coupent l'écoute très régulièrement : on relance.
    rec.onend = () => {
      if (!state.listening || state.manualStop) return;
      const delay = state.errorStreak > 3 ? Math.min(400 * state.errorStreak, 5000) : 250;
      clearTimeout(state.restartTimer);
      state.restartTimer = setTimeout(() => {
        if (!state.listening || state.manualStop) return;
        try { rec.start(); } catch (e) {
          if (!/already/i.test(e && e.message ? e.message : '')) {
            state.restartTimer = setTimeout(() => { try { rec.start(); } catch (e2) { /* ignoré */ } }, 1200);
          }
        }
      }, delay);
    };
    return rec;
  }

  async function startListening() {
    if (!state.supported) return;
    if (!state.password) {
      await askPassword('Saisis le mot de passe de l’application pour activer le copilote.');
    }
    showMsg('micMsg', '');
    showMsg('resumeMsg', '');
    state.manualStop = false;
    state.errorStreak = 0;
    if (!state.recognition) state.recognition = buildRecognition();
    try { state.recognition.start(); }
    catch (e) {
      if (!/already/i.test(e && e.message ? e.message : '')) {
        showMsg('micMsg', 'Démarrage du micro impossible : ' + esc(e.message || 'erreur inconnue'));
        return;
      }
    }
    state.listening = true;
    state.started = true;
    state.ended = false;
    state.lastResume = Date.now();
    if (!state.qLastAt) state.qLastAt = Date.now();
    startChrono();
    requestWakeLock();
    clearInterval(state.autoTimer);
    state.autoTimer = setInterval(autoTick, 3000);
    $('endBtn').disabled = false;
    $('topic').disabled = true;
    updateUi();
    persist();
  }

  function stopListening() {
    if (state.listening) { state.elapsedMs = elapsedNow(); state.listening = false; }
    state.manualStop = true;
    clearTimeout(state.restartTimer);
    clearInterval(state.autoTimer);
    if (state.recognition) { try { state.recognition.stop(); } catch (e) { /* ignoré */ } }
    setInterim('');
    stopChrono();
    releaseWakeLock();
    updateUi();
    persist();
  }

  /* ============================ CHRONO / WAKE =========================== */
  function startChrono() {
    clearInterval(state.chronoTimer);
    const tick = () => { $('chrono').textContent = mmss(elapsedNow()); };
    tick();
    state.chronoTimer = setInterval(tick, 1000);
  }
  function stopChrono() {
    clearInterval(state.chronoTimer);
    $('chrono').textContent = mmss(elapsedNow());
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      state.wakeLock = await navigator.wakeLock.request('screen');
      state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
    } catch (e) { state.wakeLock = null; }
  }
  function releaseWakeLock() {
    if (state.wakeLock) { try { state.wakeLock.release(); } catch (e) { /* ignoré */ } state.wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.listening) {
      requestWakeLock();
      if (state.recognition && !state.manualStop) {
        try { state.recognition.start(); } catch (e) { /* déjà active */ }
      }
    }
  });

  /* ================================ UI ================================== */
  function updateUi() {
    const dot = $('dot');
    dot.className = 'dot' + (state.listening ? ' rec' : (state.started && !state.ended ? ' paused' : ''));
    $('liveLabel').textContent = state.listening ? 'Écoute en cours'
      : (state.ended ? 'Terminée' : (state.started ? 'En pause' : 'Prêt'));
    $('listenBtn').classList.toggle('on', state.listening);
    $('listenBtn').querySelector('.ico').textContent = state.listening ? '⏸' : '🎙';
    $('listenLabel').textContent = state.listening ? 'Pause' : (state.started ? 'Reprendre' : 'Écouter');
  }

  $('listenBtn').addEventListener('click', () => {
    if (state.listening) stopListening(); else startListening();
  });
  $('topic').addEventListener('change', () => lsSet(LS_TOPIC, $('topic').value.trim()));

  /* ============================ PERSISTANCE ============================= */
  let persistTimer = null;
  function cancelPersist() {
    clearTimeout(persistTimer);
    persistTimer = null;
  }
  function persist() {
    if (persistTimer) return;
    persistTimer = setTimeout(() => {
      persistTimer = null;
      lsSet(LS_MEETING, {
        segments: state.segments.slice(-4000),
        questions: state.questions.slice(-200),
        elapsedMs: elapsedNow(),
        started: state.started,
        ended: state.ended,
        summaryText: state.summaryText,
        topic: $('topic').value.trim(),
        savedAt: Date.now()
      });
    }, 1000);
  }

  function loadMeeting(m) {
    state.segments = Array.isArray(m.segments) ? m.segments : [];
    state.questions = Array.isArray(m.questions) ? m.questions : [];
    state.elapsedMs = m.elapsedMs || 0;
    state.started = !!m.started;
    state.ended = !!m.ended;
    state.summaryText = m.summaryText || '';
    qSeq = state.questions.reduce((n, q) => Math.max(n, q.id || 0), 0);
    state.qLastChars = plainChars();
    if (m.topic) $('topic').value = m.topic;
    renderTranscript();
    renderQuestions();
    $('chrono').textContent = mmss(state.elapsedMs);
    $('endBtn').disabled = !state.segments.length;
    updateUi();
  }

  /* ================================ BILAN =============================== */
  const HEADINGS = [
    'RÉSUMÉ', 'RESUME',
    'POINTS CLÉS & INFORMATIONS OBTENUES', 'POINTS CLES & INFORMATIONS OBTENUES',
    'POINTS CLÉS ET INFORMATIONS OBTENUES', 'POINTS CLES ET INFORMATIONS OBTENUES',
    'DÉCISIONS PRISES', 'DECISIONS PRISES',
    'ACTIONS À FAIRE', 'ACTIONS A FAIRE',
    'QUESTIONS RESTÉES SANS RÉPONSE / POINTS OUVERTS',
    'QUESTIONS RESTEES SANS REPONSE / POINTS OUVERTS',
    'QUESTIONS RESTÉES SANS RÉPONSE', 'QUESTIONS RESTEES SANS REPONSE',
    'OÙ ON EN EST', 'OU ON EN EST',
    'PROCHAINE ÉTAPE RECOMMANDÉE', 'PROCHAINE ETAPE RECOMMANDEE'
  ];

  const isHeading = (line) => {
    const t = line.trim().replace(/^#+\s*/, '').replace(/\*\*/g, '').replace(/\s*:$/, '');
    return HEADINGS.indexOf(t.toUpperCase()) !== -1 ? t.toUpperCase() : null;
  };

  function renderSummary(text) {
    const lines = text.split('\n');
    const out = [];
    lines.forEach((line, i) => {
      const head = isHeading(line);
      if (head) { out.push('<h3>' + esc(head) + '</h3>'); return; }
      // Les marges du titre suffisent : on retire les lignes vides qui le jouxtent.
      if (!line.trim()) {
        const prev = i > 0 ? lines[i - 1] : '';
        let next = '';
        for (let j = i + 1; j < lines.length; j++) { if (lines[j].trim()) { next = lines[j]; break; } }
        if (isHeading(prev) || isHeading(next)) return;
      }
      out.push(esc(line));
    });
    $('summaryBody').innerHTML = out.join('\n');
  }

  async function endMeeting() {
    stopListening();
    state.ended = true;
    updateUi();
    $('summaryView').hidden = false;
    $('summaryBody').innerHTML = '<div class="center-load"><span class="spin"></span><br><br>Génération du bilan…</div>';
    $('copyBtn').disabled = true;
    $('dlBtn').disabled = true;
    try {
      const out = await callApi({
        mode: 'summary',
        transcript: fullText(),
        asked: state.questions.filter((q) => q.asked).map((q) => q.text)
      });
      state.summaryText = out;
      renderSummary(out);
      $('copyBtn').disabled = false;
      $('dlBtn').disabled = false;
      persist();
    } catch (e) {
      $('summaryBody').innerHTML =
        '<div class="msg err"><b>Bilan non généré.</b><br>' + esc(e.message) + '</div>' +
        '<button class="btn wide" id="retrySum">Réessayer</button>';
      const r = $('retrySum');
      if (r) r.addEventListener('click', endMeeting);
    }
  }
  $('endBtn').addEventListener('click', endMeeting);
  $('closeSummary').addEventListener('click', () => { $('summaryView').hidden = true; });

  /* ============================== EXPORTS =============================== */
  function buildMarkdown() {
    const topic = $('topic').value.trim();
    const askedQ = state.questions.filter((q) => q.asked);
    const lines = [
      '# Bilan de réunion',
      '',
      '- **Date** : ' + new Date().toLocaleString('fr-FR'),
      '- **Durée** : ' + mmss(elapsedNow()),
      '- **Sujet** : ' + (topic || 'non précisé'),
      '',
      '---',
      '',
      state.summaryText || 'non précisé',
      '',
      '---',
      '',
      '## Questions posées',
      ''
    ];
    lines.push(askedQ.length ? askedQ.map((q) => '- ' + q.text).join('\n') : '_Aucune question marquée comme posée._');
    lines.push('', '## Questions proposées non posées', '');
    const notAsked = state.questions.filter((q) => !q.asked);
    lines.push(notAsked.length ? notAsked.map((q) => '- ' + q.text).join('\n') : '_Aucune._');
    lines.push('', '---', '', '## Transcription complète', '', fullText() || '_Vide._', '');
    return lines.join('\n');
  }

  function stamp() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  $('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(buildMarkdown());
      $('copyBtn').textContent = '✅ Copié';
      setTimeout(() => { $('copyBtn').textContent = '📋 Copier'; }, 1800);
    } catch (e) { alert('Copie impossible — utilise le téléchargement.'); }
  });

  $('dlBtn').addEventListener('click', () => {
    try {
      const blob = new Blob([buildMarkdown()], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'reunion-' + stamp() + '.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { alert('Téléchargement impossible — utilise « Copier ».'); }
  });

  /* =========================== NOUVELLE RÉUNION ========================= */
  function resetMeeting() {
    stopListening();
    // stopListening() programme une sauvegarde différée : l'annuler, sinon elle
    // ressusciterait la réunion juste après l'effacement.
    cancelPersist();
    state.segments = []; state.questions = []; state.summaryText = '';
    state.elapsedMs = 0; state.started = false; state.ended = false;
    state.qLastChars = 0; state.qLastAt = 0; state.recognition = null;
    qSeq = 0;
    lsDel(LS_MEETING);
    renderTranscript();
    renderQuestions();
    setInterim('');
    $('chrono').textContent = '00:00';
    $('endBtn').disabled = true;
    $('topic').disabled = false;
    $('trDetails').open = false;
    $('summaryView').hidden = true;
    ['qErr', 'micMsg', 'resumeMsg', 'fatalMsg'].forEach((id) => showMsg(id, ''));
    checkSupport();
    updateUi();
  }

  $('newBtn').addEventListener('click', () => {
    if (!confirm('Effacer cette réunion et repartir de zéro ?\nLe bilan non téléchargé sera perdu.')) return;
    resetMeeting();
  });

  window.addEventListener('beforeunload', (e) => {
    if (state.listening || (state.segments.length && !state.summaryText)) {
      e.preventDefault(); e.returnValue = '';
    }
  });

  /* ============================== DÉMARRAGE ============================= */
  function boot() {
    initTranscriptDom();
    renderQuestions();

    const savedTopic = lsGet(LS_TOPIC);
    if (savedTopic) $('topic').value = savedTopic;

    const pw = lsGet(LS_PW);
    if (pw) state.password = pw;

    const supported = checkSupport();

    // Réunion non terminée retrouvée ?
    const m = lsGet(LS_MEETING);
    const recent = m && m.savedAt && (Date.now() - m.savedAt < 12 * 3600 * 1000);
    const worthResuming = recent && Array.isArray(m.segments) && m.segments.length > 0;

    if (worthResuming) {
      const mins = Math.round((m.elapsedMs || 0) / 60000);
      showMsg('resumeMsg',
        '<b>Réunion non terminée retrouvée</b> — ' + m.segments.length + ' passages transcrits' +
        (mins ? ', ' + mins + ' min' : '') + '.' +
        '<div class="acts">' +
        '<button class="btn primary" id="resumeYes">Reprendre</button>' +
        '<button class="btn" id="resumeNo">Nouvelle réunion</button></div>');
      $('resumeYes').addEventListener('click', () => {
        loadMeeting(m);
        showMsg('resumeMsg', '');
        if (m.summaryText) { renderSummary(m.summaryText); $('summaryView').hidden = false; }
      });
      $('resumeNo').addEventListener('click', () => { showMsg('resumeMsg', ''); resetMeeting(); });
    } else {
      if (m) lsDel(LS_MEETING);
      updateUi();
    }

    // Premier lancement : on demande le mot de passe une seule fois.
    if (!state.password && supported && !worthResuming) {
      askPassword('Saisis le mot de passe de l’application. Il sera mémorisé sur ce téléphone.');
    }
  }

  boot();
})();
</script>
</body>
</html>
